<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CriptoEjesus — MultiChat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  /* ── Reset & Base ── */
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  :root {
    /* Platform Colors */
    --twitch: #9147ff;
    --youtube: #ff0000;
    --kick: #53fc18;
    --abstract: #00ffa3;
    
    /* Dynamic UI Variables */
    --bg-alpha: 1;
    --font-scale: 1;
    
    /* Themed Colors (linked to alpha) */
    --bg: rgba(14, 14, 16, var(--bg-alpha));
    --surface: rgba(24, 24, 27, var(--bg-alpha));
    --surface2: #1f1f23;
    --border: rgba(255, 255, 255, 0.07);
    --text: #efeff1;
    --muted: #adadb8;
    
    /* Typography */
    --font: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  /* CRITICAL FOR OBS TRANSPARENCY: 
     Force the browser engine's floor to be transparent 
  */
  html, body { 
    height: 100%; 
    background: transparent !important; 
    color: var(--text); 
    font-family: var(--font); 
    overflow: hidden; 
  }

  #app { 
    display: flex; 
    flex-direction: column; 
    height: 100vh; 
    background: var(--bg); 
    transition: background 0.1s ease; 
  }

  /* ── Header ── */
  header {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 6px;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .logo { 
    font-family: var(--mono); 
    font-size: 13px; 
    font-weight: 500; 
    color: var(--text); 
    letter-spacing: 0.03em; 
  }

  .live-badge {
    font-size: 10px; 
    font-weight: 600; 
    letter-spacing: 0.08em;
    background: #eb0400; 
    color: #fff;
    padding: 2px 6px; 
    border-radius: 3px;
    text-transform: uppercase;
  }

  /* ── Control Sliders ── */
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .control-label {
    font-size: 9px;
    font-family: var(--mono);
    color: var(--muted);
    text-transform: uppercase;
    min-width: 26px;
  }

  .control-val {
    font-size: 9px;
    font-family: var(--mono);
    color: var(--abstract);
    min-width: 32px;
    text-align: right;
  }

  input[type="range"] {
    flex: 1;
    height: 4px;
    accent-color: var(--abstract);
    cursor: pointer;
  }

  /* ── Filter Tabs ── */
  .filter-tabs { 
    display: flex; 
    gap: 4px; 
  }

  .tab {
    font-size: 11px; 
    font-weight: 500; 
    padding: 3px 8px;
    border-radius: 4px; 
    border: 1px solid transparent;
    cursor: pointer; 
    transition: all 0.15s; 
    background: none;
    color: var(--muted); 
    font-family: var(--font);
    display: flex; 
    align-items: center; 
    gap: 5px;
  }

  .tab.active-all    { background: rgba(255, 255, 255, 0.08); color: var(--text); border-color: var(--border); }
  .tab.active-twitch { background: rgba(145, 71, 255, 0.15); color: var(--twitch); border-color: rgba(145, 71, 255, 0.3); }
  .tab.active-youtube{ background: rgba(255, 0, 0, 0.12); color: #ff4444; border-color: rgba(255, 0, 0, 0.25); }
  .tab.active-kick     { background: rgba(83, 252, 24, 0.1); color: var(--kick); border-color: rgba(83, 252, 24, 0.25); }
  .tab.active-abstract { background: rgba(0, 255, 163, 0.1); color: var(--abstract); border-color: rgba(0, 255, 163, 0.25); }
  
  .tab:hover:not([class*="active"]) { 
    background: rgba(255, 255, 255, 0.04); 
    color: var(--text); 
  }

  .tab.icon-tab {
    padding: 4px 6px;
    line-height: 0;
  }

  /* ── Footer Counter Buttons ── */
  .counter-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 3px 7px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .counter-btn:hover:not([class*="active"]) {
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }

  .counter-btn.active-all     { background: rgba(255,255,255,0.08); color: var(--text); border-color: var(--border); }
  .counter-btn.active-twitch  { background: rgba(145,71,255,0.15); color: var(--twitch); border-color: rgba(145,71,255,0.3); }
  .counter-btn.active-youtube { background: rgba(255,0,0,0.12); color: #ff4444; border-color: rgba(255,0,0,0.25); }
  .counter-btn.active-kick    { background: rgba(83,252,24,0.1); color: var(--kick); border-color: rgba(83,252,24,0.25); }
  .counter-btn.active-abstract{ background: rgba(0,255,163,0.1); color: var(--abstract); border-color: rgba(0,255,163,0.25); }

  /* ── Messages Area ── */
  #messages {
    flex: 1; 
    overflow-y: auto; 
    padding: 6px 0;
    scroll-behavior: smooth;
  }

  /* Custom Scrollbar linked to BG opacity */
  #messages::-webkit-scrollbar { 
    width: 4px; 
  }
  #messages::-webkit-scrollbar-track { 
    background: transparent; 
  }
  #messages::-webkit-scrollbar-thumb { 
    background: rgba(255, 255, 255, calc(0.2 * var(--bg-alpha))); 
    border-radius: 2px; 
  }

  .msg {
    display: flex; 
    align-items: flex-start; 
    gap: 8px;
    padding: 5px 12px; 
    transition: background 0.1s;
  }

  .msg:hover { 
    background: rgba(255, 255, 255, 0.03); 
  }

  .platform-hidden { 
    display: none !important; 
  }

  /* ── Chat Content Scaling ── */
  .username { 
    font-size: calc(12px * var(--font-scale)); 
    font-weight: 600; 
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  
  .u-twitch    { color: var(--twitch); }
  .u-youtube   { color: #ff4444; }
  .u-kick      { color: var(--kick); }
  .u-abstract  { color: var(--abstract); }

  .timestamp { 
    font-size: calc(10px * var(--font-scale)); 
    color: rgba(173, 173, 184, 0.45); 
    font-family: var(--mono); 
  }

  .badge { 
    font-size: calc(9px * var(--font-scale)); 
    font-weight: 600; 
    letter-spacing: 0.05em; 
    padding: 1px 4px; 
    border-radius: 2px; 
    text-transform: uppercase; 
  }
  
  .badge-sub { background: rgba(145, 71, 255, 0.2); color: #c08fff; }
  .badge-mod { background: rgba(83, 252, 24, 0.12); color: #7dff6b; }
  .badge-vip { background: rgba(255, 180, 0, 0.15); color: #ffcc44; }

  .msg-body  { 
    flex: 1; 
    min-width: 0;
    overflow: hidden;
  }
  
  .msg-header { 
    display: flex; 
    align-items: baseline; 
    gap: 6px; 
    flex-wrap: wrap; 
  }
  
  .msg-text  { 
    font-size: calc(13px * var(--font-scale)); 
    color: var(--text); 
    line-height: 1.5; 
    margin-top: 1px; 
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .platform-tag {
    font-size: calc(9px * var(--font-scale)); 
    font-family: var(--mono); 
    font-weight: 500;
    padding: 1px 4px; 
    border-radius: 2px; 
    letter-spacing: 0.04em;
    text-transform: uppercase; 
    flex-shrink: 0; 
    margin-top: 3px;
  }
  
  .pt-twitch   { background: rgba(145, 71, 255, 0.15); color: #c08fff; }
  .pt-youtube  { background: rgba(255, 0, 0, 0.12); color: #ff8080; }
  .pt-kick     { background: rgba(83, 252, 24, 0.1); color: #7dff6b; }
  .pt-abstract { background: rgba(0, 255, 163, 0.1); color: #00ffa3; }

  /* ── Links Bar ── */
  .links-bar {
    display: flex; 
    gap: 6px; 
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
    /* Invisible horizontal scroll */
    scrollbar-width: none; 
    -ms-overflow-style: none; 
  }
  
  .links-bar::-webkit-scrollbar { 
    display: none; 
  }

  .stream-link {
    font-size: 10px; 
    font-family: var(--mono);
    padding: 2px 7px; 
    border-radius: 3px;
    text-decoration: none; 
    font-weight: 500;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  
  .stream-link:hover { opacity: 0.75; }
  .sl-twitch    { background: rgba(145, 71, 255, 0.15); color: #c08fff; }
  .sl-youtube   { background: rgba(255, 0, 0, 0.12); color: #ff8080; }
  .sl-kick      { background: rgba(83, 252, 24, 0.1); color: #7dff6b; }
  .sl-abstract  { background: rgba(0, 255, 163, 0.1); color: #00ffa3; }

  /* ── Footer ── */
  footer {
    padding: 8px 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    flex-shrink: 0;
    gap: 8px;
  }

  .counters { 
    display: flex; 
    gap: 12px; 
    flex-wrap: wrap; 
  }
  
  .counter { 
    font-size: 11px; 
    color: var(--muted); 
    font-family: var(--mono); 
    display: flex; 
    align-items: center; 
    gap: 4px; 
  }
  
  .counter-num { 
    font-weight: 500; 
    color: var(--text); 
  }

  .auto-scroll-btn {
    font-size: 11px; 
    font-weight: 500; 
    padding: 3px 8px;
    border-radius: 4px; 
    border: 1px solid var(--border);
    background: none; 
    color: var(--muted); 
    cursor: pointer;
    font-family: var(--font); 
    transition: all 0.15s;
    white-space: nowrap;
  }
  
  .auto-scroll-btn.on { 
    border-color: rgba(145, 71, 255, 0.4); 
    color: var(--twitch); 
    background: rgba(145, 71, 255, 0.08); 
  }
  
  .auto-scroll-btn:hover { 
    background: rgba(255, 255, 255, 0.05); 
  }

  /* ── UI Toggle Button ── */
  .toggle-ui-btn {
    position: fixed;
    top: 6px;
    right: 6px;
    z-index: 999;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    padding: 3px 7px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s;
    opacity: 0.35;
  }

  .toggle-ui-btn:hover {
    opacity: 1;
    color: var(--text);
    background: rgba(255,255,255,0.12);
  }

  /* When hidden, collapse header, links bar, and footer */
  .ui-hidden header,
  .ui-hidden .links-bar,
  .ui-hidden footer {
    display: none !important;
  }

  /* Button fades out in hidden mode, reappears on hover */
  .ui-hidden .toggle-ui-btn {
    opacity: 0;
  }
  .ui-hidden .toggle-ui-btn:hover {
    opacity: 1;
  }

  .empty-state {
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    height: 100%; 
    gap: 8px; 
    color: var(--muted); 
    padding: 2rem;
  }
  
  .empty-state p { 
    font-size: 13px; 
    text-align: center; 
    line-height: 1.7; 
  }
</style>
</head>
<body>
<div id="app">

  <button class="toggle-ui-btn" onclick="toggleUI()" title="Hide/show UI">UI</button>

  <header>
    <div class="header-top">
      <span class="logo">criptoejesus</span>
      <span class="live-badge">live</span>
    </div>
    <div class="header-left">
      <div class="control-group">
        <label for="bg-slider" class="control-label">BG</label>
        <input type="range" id="bg-slider" min="0" max="1" step="0.01" value="1">
        <span class="control-val" id="bg-val">100%</span>
      </div>
      <div class="control-group">
        <label for="font-slider" class="control-label">Size</label>
        <input type="range" id="font-slider" min="0.5" max="2" step="0.05" value="1">
        <span class="control-val" id="font-val">100%</span>
      </div>
    </div>
  </header>

  <div class="links-bar">
    <a class="stream-link sl-twitch"    href="https://twitch.tv/criptoejesus"    target="_blank">Twitch</a>
    <a class="stream-link sl-youtube"   href="https://youtube.com/@criptoejesus" target="_blank">YouTube</a>
    <a class="stream-link sl-kick"      href="https://kick.com/criptoejesus"     target="_blank">Kick</a>
    <a class="stream-link sl-abstract"  href="https://portal.abs.xyz/stream/criptoejesus" target="_blank">Abstract</a>
  </div>

  <div id="messages">
    <div class="empty-state" id="empty">
      <p>Waiting for messages…</p>
    </div>
  </div>

  <footer>
    <div class="counters">
      <button class="counter-btn active-all" id="fbtn-all" onclick="setFilter('all', this)" data-filter="all" title="All platforms">All</button>
      <button class="counter-btn" id="fbtn-twitch" onclick="setFilter('twitch', this)" data-filter="twitch" title="Twitch only">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        <span id="cnt-twitch">0</span>
      </button>
      <button class="counter-btn" id="fbtn-youtube" onclick="setFilter('youtube', this)" data-filter="youtube" title="YouTube only">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>
        <span id="cnt-youtube">0</span>
      </button>
      <button class="counter-btn" id="fbtn-kick" onclick="setFilter('kick', this)" data-filter="kick" title="Kick only">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M3 2h4v8l5-8h5l-5 8 5 8h-5l-5-8v8H3z"/></svg>
        <span id="cnt-kick">0</span>
      </button>
      <button class="counter-btn" id="fbtn-abstract" onclick="setFilter('abstract', this)" data-filter="abstract" title="Abstract only">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M12 2L3 7v10l9 5 9-5V7L12 2zm0 2.18L19 8.1v7.8l-7 3.92-7-3.92V8.1l7-3.92z"/></svg>
        <span id="cnt-abstract">0</span>
      </button>
    </div>
    <button class="auto-scroll-btn on" id="scroll-btn" onclick="toggleAutoScroll()">⬆️⬇️</button>
  </footer>

</div>

<script>
/* ── State Management ── */
let filter = 'all';
let autoScroll = true;
let counts = { twitch: 0, youtube: 0, kick: 0, abstract: 0 };

const msgContainer = document.getElementById('messages');
const emptyState   = document.getElementById('empty');

/* ── UI Handlers ── */
document.getElementById('bg-slider').addEventListener('input', (e) => {
  const val = e.target.value;
  document.documentElement.style.setProperty('--bg-alpha', val);
  document.getElementById('bg-val').textContent = Math.round(val * 100) + '%';
});

document.getElementById('font-slider').addEventListener('input', (e) => {
  const val = e.target.value;
  document.documentElement.style.setProperty('--font-scale', val);
  document.getElementById('font-val').textContent = Math.round(val * 100) + '%';
});

/* ── Filtering ── */
function setFilter(f, btn) {
  filter = f;
  // Update footer counter buttons
  document.querySelectorAll('.counter-btn').forEach(b => {
    b.classList.remove('active-all','active-twitch','active-youtube','active-kick','active-abstract');
  });
  const fbtn = document.getElementById('fbtn-' + f);
  if (fbtn) fbtn.classList.add('active-' + f);
  // Filter messages
  document.querySelectorAll('.msg').forEach(m => {
    m.classList.toggle('platform-hidden', f !== 'all' && m.dataset.platform !== f);
  });
}

/* ── Scrolling Logic ── */
function toggleAutoScroll() {
  // Auto-scroll locked on
}

// Auto-scroll is always on — scroll listener removed

/* ── Platform UI Configuration ── */
const platformData = {
  twitch:   { tag: 'pt-twitch',   uClass: 'u-twitch',   label: 'TW' },
  youtube:  { tag: 'pt-youtube',  uClass: 'u-youtube',  label: 'YT' },
  kick:     { tag: 'pt-kick',     uClass: 'u-kick',     label: 'KC' },
  abstract: { tag: 'pt-abstract', uClass: 'u-abstract', label: 'ABS' }
};

/* Helper: Escape HTML to prevent XSS */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Public Message Interface ── */
function addMessage(platform, username, text, badge) {
  if (!platformData[platform]) return;
  emptyState.style.display = 'none';

  counts[platform]++;
  document.getElementById('cnt-' + platform).textContent = counts[platform];

  const p    = platformData[platform];
  const time = new Date().toTimeString().slice(0, 5);

  const badgeMap = { sub: 'badge-sub', mod: 'badge-mod', vip: 'badge-vip' };
  const badgeHtml = badge && badgeMap[badge]
    ? `<span class="badge ${badgeMap[badge]}">${esc(badge)}</span>` : '';

  const div = document.createElement('div');
  div.className = 'msg' + (filter !== 'all' && filter !== platform ? ' platform-hidden' : '');
  div.dataset.platform = platform;
  div.innerHTML = `
    <span class="platform-tag ${p.tag}">${p.label}</span>
    <div class="msg-body">
      <div class="msg-header">
        <span class="username ${p.uClass}">${esc(username)}</span>
        ${badgeHtml}
        <span class="timestamp">${time}</span>
      </div>
      <div class="msg-text">${esc(text)}</div>
    </div>`;

  msgContainer.appendChild(div);
  if (autoScroll) msgContainer.scrollTop = msgContainer.scrollHeight;
}

/* ── Streamer.bot WebSocket ── */
const SB_WS = 'ws://127.0.0.1:8080/';

function connectStreamerBot() {
  const ws = new WebSocket(SB_WS);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      request: 'Subscribe',
      events: {
        Twitch:  ['ChatMessage'],
        YouTube: ['Message'],
        Kick:    ['ChatMessage']
      },
      id: 'multichat-sub'
    }));
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      handleSBEvent(data);
    } catch(e) {}
  };

  ws.onclose = () => setTimeout(connectStreamerBot, 5000);
}

function handleSBEvent(data) {
  const evt = data.event;
  if (!evt) return;

  if (evt.source === 'Twitch' && evt.type === 'ChatMessage') {
    const m = data.data.message;
    addMessage('twitch', m.displayName, m.message, m.subscriber ? 'sub' : m.moderator ? 'mod' : '');
  }
  
  if (evt.source === 'YouTube' && evt.type === 'Message') {
    const m = data.data.message;
    addMessage('youtube', m.author, m.message, '');
  }
  
  if (evt.source === 'Kick' && evt.type === 'ChatMessage') {
    // Streamer.bot nests Kick data inside data.data.message
    const d = data.data?.message || data.data || {};

    const username =
      d.user?.login ||
      d.user?.name ||
      d.user?.username ||
      d.sender?.login ||
      d.sender?.username ||
      'Kick User';

    let text = '';
    if (typeof d.text === 'string' && d.text) {
      text = d.text;
    } else if (Array.isArray(d.parts) && d.parts.length) {
      text = d.parts.map(p => p.text || '').join('');
    } else if (typeof d.content === 'string' && d.content) {
      text = d.content;
    } else {
      text = '[DEBUG]: ' + JSON.stringify(d);
    }

    const isMod = d.user?.isModerator || d.user?.is_moderator || false;
    const isSub = d.user?.isSubscribed || d.user?.is_subscriber || false;
    const badge = isSub ? 'sub' : isMod ? 'mod' : '';

    addMessage('kick', username, text, badge);
  }
}

connectStreamerBot();

/* ── Abstract Chat WebSocket ── */
const ABS_WS_URL = 'wss://abstools.top/api/ws?channel_id=fc9895d2-a15e-48ba-8b71-e41f6ff972d6';
const ABS_SEEN   = new Set();

function connectAbstract() {
  const ws = new WebSocket(ABS_WS_URL);
  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      
      if (data.type === 'chat_history' && data.payload?.messages) {
        data.payload.messages.forEach(m => {
          if (!ABS_SEEN.has(m.id)) {
            ABS_SEEN.add(m.id);
            addMessage('abstract', m.user_name || 'anon', m.text || '', '');
          }
        });
      }
      
      if (data.type === 'chat_message' && data.payload) {
        const m = data.payload;
        if (!ABS_SEEN.has(m.id)) {
          ABS_SEEN.add(m.id);
          addMessage('abstract', m.user_name || 'anon', m.text || '', '');
        }
      }
    } catch(e) {}
  };
  ws.onclose = () => setTimeout(connectAbstract, 5000);
}

connectAbstract();

function toggleUI() {
  document.getElementById('app').classList.toggle('ui-hidden');
}

// Global access for debugging/external triggers
window.addMessage = addMessage;
</script>
